<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Wildlife Gallery</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    .gallery {
      width: 100%;
    }

    .image-container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    /* Hero image fills screen perfectly */
    .hero img {
      height: 90vh;
      object-fit: cover;
    }

    /* Subtle scroll cue (next image peeks slightly) */
    .peek {
      margin-top: -10vh;
    }
  </style>
</head>

<body>
  <div class="gallery">

    <!-- HERO IMAGE (your main talking point) -->
    <div class="image-container hero">
      <img src="animal1.jpg" alt="Animal 1">
    </div>

    <!-- Slight peek effect -->
    <div class="image-container peek">
      <img src="animal2.jpg" alt="Animal 2">
    </div>

    <div class="image-container">
      <img src="animal3.jpg" alt="Animal 3">
    </div>

    <div class="image-container">
      <img src="animal4.jpg" alt="Animal 4">
    </div>

    <div class="image-container">
      <img src="animal5.jpg" alt="Animal 5">
    </div>

  </div>
</body>
</html>
